<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages - Nexus Matchmaker</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .chat-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 20px;
            height: calc(100vh - 120px);
            min-height: 520px;
        }
        .chat-list {
            background: var(--surface);
            border-radius: 12px;
            padding: 20px;
            overflow-y: auto;
            border: 1px solid #334155;
        }
        .chat-list h3 {
            margin-bottom: 5px;
        }
        .chat-list-subtitle {
            color: var(--text-muted);
            font-size: 0.8rem;
            margin-bottom: 18px;
        }
        .chat-item {
            padding: 14px;
            margin-bottom: 10px;
            background: var(--bg);
            border-radius: 10px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s;
        }
        .chat-item:hover {
            border-color: rgba(139, 92, 246, 0.6);
            transform: translateY(-1px);
        }
        .chat-item.active {
            border-color: var(--primary);
            background: rgba(139, 92, 246, 0.12);
        }
        .chat-item-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 8px;
        }
        .chat-item-name {
            color: var(--text);
            font-weight: 700;
            font-size: 0.95rem;
        }
        .chat-item-role {
            color: var(--primary);
            font-size: 0.78rem;
            margin-top: 2px;
        }
        .chat-item-preview {
            color: var(--text-muted);
            font-size: 0.78rem;
            margin-top: 8px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .chat-item-time {
            color: var(--text-muted);
            font-size: 0.68rem;
            white-space: nowrap;
        }
        .status-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 0.66rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            margin-top: 7px;
            text-transform: uppercase;
        }
        .status-hired {
            background: rgba(16, 185, 129, 0.18);
            color: var(--success);
        }
        .status-applied {
            background: rgba(96, 165, 250, 0.18);
            color: #60a5fa;
        }
        .status-connected {
            background: rgba(139, 92, 246, 0.18);
            color: var(--primary);
        }
        .chat-window {
            background: var(--surface);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #334155;
        }
        .chat-header {
            padding: 18px 22px;
            border-bottom: 1px solid #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }
        .chat-header h3 {
            margin: 0;
            color: var(--text);
        }
        .chat-header p {
            color: var(--text-muted);
            margin: 4px 0 0 0;
            font-size: 0.85rem;
        }
        .chat-context {
            color: #60a5fa;
            font-size: 0.75rem;
            margin-top: 4px;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 22px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background:
                radial-gradient(circle at 20% 10%, rgba(139, 92, 246, 0.05), transparent 35%),
                var(--surface);
        }
        .message {
            max-width: 72%;
            padding: 11px 15px;
            border-radius: 14px;
            word-wrap: break-word;
            overflow-wrap: anywhere;
            animation: messageIn 0.16s ease-out;
        }
        @keyframes messageIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message.sent {
            align-self: flex-end;
            background: var(--primary);
            color: white;
            border-bottom-right-radius: 4px;
        }
        .message.received {
            align-self: flex-start;
            background: var(--bg);
            color: var(--text);
            border: 1px solid #334155;
            border-bottom-left-radius: 4px;
        }
        .message-sender {
            font-size: 0.68rem;
            font-weight: 700;
            opacity: 0.75;
            margin-bottom: 3px;
        }
        .message-time {
            font-size: 0.66rem;
            opacity: 0.65;
            margin-top: 5px;
            text-align: right;
        }
        .chat-input-container {
            padding: 16px 20px;
            border-top: 1px solid #334155;
            display: flex;
            gap: 10px;
            background: rgba(15, 23, 42, 0.35);
        }
        .chat-input {
            flex: 1;
            padding: 12px 14px;
            background: var(--bg);
            border: 1px solid #334155;
            border-radius: 10px;
            color: var(--text);
            font-size: 0.95rem;
            outline: none;
        }
        .chat-input:focus {
            border-color: var(--primary);
        }
        .send-btn {
            padding: 12px 24px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }
        .send-btn:hover {
            background: var(--primary-hover);
        }
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-muted);
            font-size: 1rem;
            text-align: center;
            padding: 30px;
            gap: 8px;
        }
        .empty-state .big-icon {
            font-size: 2.5rem;
            opacity: 0.7;
        }
        .chat-placeholder {
            margin: auto;
            color: var(--text-muted);
            text-align: center;
            font-size: 0.9rem;
            line-height: 1.6;
        }
        .sidebar-empty {
            color: var(--text-muted);
            font-size: 0.85rem;
            line-height: 1.6;
            padding: 15px 5px;
        }
        @media (max-width: 760px) {
            .chat-container {
                grid-template-columns: 1fr;
                height: auto;
            }
            .chat-list {
                max-height: 260px;
            }
            .chat-window {
                min-height: 520px;
            }
            .message {
                max-width: 88%;
            }
        }
    </style>
</head>
<body>
    <nav>
        <h1>💬 Messages</h1>
        <div>
            <span id="navUserName" style="margin-right: 16px; color: var(--text-muted);"></span>
            <button onclick="goBack()">← Dashboard</button>
            <button class="secondary" onclick="logout()" style="margin-left: 10px;">Logout</button>
        </div>
    </nav>

    <div class="chat-container">
        <!-- Conversation list -->
        <div class="chat-list">
            <h3>Conversations</h3>
            <p class="chat-list-subtitle">Chats open after an application or hire.</p>
            <div id="chatList"></div>
        </div>

        <!-- Chat window -->
        <div class="chat-window">
            <div id="emptyState" class="empty-state">
                <div class="big-icon">💬</div>
                <div>Select a conversation to start chatting</div>
                <div style="font-size: 0.8rem;">Apply to a creator's job or hire a freelancer to unlock a chat.</div>
            </div>
            <div id="chatContent" style="display: none; height: 100%; flex-direction: column;">
                <div class="chat-header">
                    <div>
                        <h3 id="chatName" style="margin: 0;"></h3>
                        <p id="chatRole"></p>
                        <p id="chatContext" class="chat-context"></p>
                    </div>
                    <span id="chatStatusBadge" class="status-badge status-connected">Connected</span>
                </div>
                <div class="chat-messages" id="chatMessages"></div>
                <div class="chat-input-container">
                    <input type="text" id="messageInput" class="chat-input" maxlength="2000" placeholder="Type a message..." autocomplete="off" />
                    <button class="send-btn" onclick="sendMessage()">Send</button>
                </div>
            </div>
        </div>
    </div>

    <script src="http://localhost:5000/socket.io/socket.io.js"></script>
    <script>
        const API_URL = 'http://localhost:5000/api';
        let socket = null;
        let currentUser = null;
        let currentChatId = null;
        let currentConversation = null;
        let conversations = [];
        const renderedMessageIds = new Set();

        // ------------------------------------------------------------
        // Boot
        // ------------------------------------------------------------
        function checkAuth() {
            const userStr = localStorage.getItem('nexus_user');
            if (!userStr) {
                window.location.href = 'index.html';
                return;
            }

            currentUser = JSON.parse(userStr);
            document.getElementById('navUserName').textContent = currentUser.name || '';

            initSocket();
            loadConversations().then(openRequestedChat);
        }

        function initSocket() {
            socket = io('http://localhost:5000');

            socket.on('connect', () => {
                if (currentUser.userType === 'creator') {
                    socket.emit('joinCreatorRoom', currentUser._id);
                } else {
                    socket.emit('joinFreelancerRoom', currentUser._id);
                }

                if (currentChatId) {
                    socket.emit('joinChatRoom', currentChatId);
                }
            });

            socket.on('newMessage', (messageData) => {
                if (messageData.chatId === currentChatId) {
                    appendMessage(messageData);
                }
                loadConversations(false);
            });

            socket.on('conversationUpdated', () => {
                loadConversations(false);
            });
        }

        // ------------------------------------------------------------
        // Conversations
        // ------------------------------------------------------------
        async function loadConversations(showErrors = true) {
            try {
                const response = await fetch(`${API_URL}/conversations/${currentUser._id}`);
                const data = await response.json();
                conversations = data.conversations || [];
                renderChatList();
                return conversations;
            } catch (error) {
                console.error('Error loading conversations:', error);
                if (showErrors) {
                    document.getElementById('chatList').innerHTML =
                        '<p class="sidebar-empty">Could not load conversations. Is the server running?</p>';
                }
                return [];
            }
        }

        function renderChatList() {
            const container = document.getElementById('chatList');

            if (conversations.length === 0) {
                container.innerHTML = `
                    <div class="sidebar-empty">
                        No conversations yet.<br><br>
                        ${currentUser.userType === 'creator'
                            ? 'Hire a freelancer or open an application to start a chat.'
                            : 'Apply to an open creator hiring, then message the creator.'}
                    </div>
                `;
                return;
            }

            container.innerHTML = '';

            conversations.forEach(conversation => {
                const otherUser = conversation.otherUser || {};
                const role = otherUser.role || otherUser.channelName || 'Content Creator';
                const status = conversation.status || 'connected';
                const statusLabel = status === 'hired' ? 'Hired' : status === 'applied' ? 'Applied' : 'Connected';
                const preview = conversation.lastMessage?.message || 'No messages yet — say hello 👋';
                const time = conversation.lastMessage?.timestamp
                    ? formatListTime(conversation.lastMessage.timestamp)
                    : '';

                const item = document.createElement('div');
                item.className = 'chat-item' + (conversation.chatId === currentChatId ? ' active' : '');
                item.dataset.chatId = conversation.chatId;
                item.onclick = () => openConversation(conversation);

                item.innerHTML = `
                    <div class="chat-item-top">
                        <div>
                            <div class="chat-item-name">${escapeHtml(otherUser.name || 'User')}</div>
                            <div class="chat-item-role">${escapeHtml(role)}</div>
                        </div>
                        <div class="chat-item-time">${escapeHtml(time)}</div>
                    </div>
                    <div class="chat-item-preview">${escapeHtml(preview)}</div>
                    <span class="status-badge status-${status}">${statusLabel}</span>
                `;

                container.appendChild(item);
            });
        }

        async function openRequestedChat() {
            const params = new URLSearchParams(window.location.search);
            const requestedChatId = params.get('chat');
            const requestedUserId = params.get('with');

            if (requestedChatId) {
                let conversation = conversations.find(c => c.chatId === requestedChatId);
                if (conversation) {
                    openConversation(conversation);
                }
                return;
            }

            if (!requestedUserId) return;

            let conversation = conversations.find(c => c.otherUser && c.otherUser._id === requestedUserId);

            if (!conversation) {
                const body = currentUser.userType === 'creator'
                    ? { creatorId: currentUser._id, freelancerId: requestedUserId, initiatorId: currentUser._id }
                    : { creatorId: requestedUserId, freelancerId: currentUser._id, initiatorId: currentUser._id };

                try {
                    const response = await fetch(`${API_URL}/conversations`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(body)
                    });

                    if (!response.ok) throw new Error('Could not create conversation');

                    const data = await response.json();
                    conversation = data.conversation;
                    await loadConversations(false);
                } catch (error) {
                    console.error('Error creating conversation:', error);
                    return;
                }
            }

            if (conversation) openConversation(conversation);
        }

        async function openConversation(conversation) {
            currentChatId = conversation.chatId;
            currentConversation = conversation;

            const otherUser = conversation.otherUser || {};
            const status = conversation.status || 'connected';
            const statusLabel = status === 'hired' ? 'Hired' : status === 'applied' ? 'Applied' : 'Connected';

            document.getElementById('emptyState').style.display = 'none';
            document.getElementById('chatContent').style.display = 'flex';
            document.getElementById('chatName').textContent = otherUser.name || 'User';
            document.getElementById('chatRole').textContent =
                [otherUser.role, otherUser.channelName, otherUser.platform].filter(Boolean).join(' • ');
            document.getElementById('chatContext').textContent = conversation.jobTitle
                ? `Regarding: ${conversation.jobTitle}`
                : '';

            const badge = document.getElementById('chatStatusBadge');
            badge.className = `status-badge status-${status}`;
            badge.textContent = statusLabel;

            document.querySelectorAll('.chat-item').forEach(item => {
                item.classList.toggle('active', item.dataset.chatId === conversation.chatId);
            });

            // Keep the URL shareable/refreshable.
            const url = new URL(window.location.href);
            url.searchParams.set('chat', conversation.chatId);
            url.searchParams.delete('with');
            window.history.replaceState({}, '', url);

            socket.emit('joinChatRoom', conversation.chatId);
            await loadMessages(conversation.chatId);

            document.getElementById('messageInput').focus();
        }

        // ------------------------------------------------------------
        // Messages
        // ------------------------------------------------------------
        async function loadMessages(chatId) {
            const container = document.getElementById('chatMessages');
            container.innerHTML = '';
            renderedMessageIds.clear();

            try {
                const response = await fetch(`${API_URL}/messages/${chatId}`);
                const data = await response.json();
                const messages = data.messages || [];

                if (messages.length === 0) {
                    container.innerHTML = `
                        <div class="chat-placeholder">
                            No messages yet.<br>
                            Start the conversation with a quick hello 👋
                        </div>
                    `;
                    return;
                }

                messages.forEach(message => appendMessage(message, false));
                scrollToBottom();
            } catch (error) {
                console.error('Error loading messages:', error);
                container.innerHTML = '<div class="chat-placeholder">Could not load messages.</div>';
            }
        }

        function appendMessage(messageData, animate = true) {
            if (!messageData || renderedMessageIds.has(messageData._id)) return;
            renderedMessageIds.add(messageData._id);

            const container = document.getElementById('chatMessages');
            const placeholder = container.querySelector('.chat-placeholder');
            if (placeholder) placeholder.remove();

            const isSent = messageData.senderId === currentUser._id;
            const messageEl = document.createElement('div');
            messageEl.className = `message ${isSent ? 'sent' : 'received'}`;
            if (!animate) messageEl.style.animation = 'none';

            if (!isSent && messageData.senderName) {
                const sender = document.createElement('div');
                sender.className = 'message-sender';
                sender.textContent = messageData.senderName;
                messageEl.appendChild(sender);
            }

            const body = document.createElement('div');
            body.textContent = messageData.message;
            messageEl.appendChild(body);

            const time = document.createElement('div');
            time.className = 'message-time';
            time.textContent = formatMessageTime(messageData.timestamp);
            messageEl.appendChild(time);

            container.appendChild(messageEl);
            scrollToBottom();
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text || !currentChatId) return;

            const payload = {
                chatId: currentChatId,
                senderId: currentUser._id,
                senderName: currentUser.name,
                message: text,
                timestamp: new Date().toISOString()
            };

            input.value = '';

            if (socket && socket.connected) {
                socket.emit('sendMessage', payload);
            } else {
                try {
                    const response = await fetch(`${API_URL}/messages/${currentChatId}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    const data = await response.json();
                    if (response.ok) appendMessage(data.message);
                } catch (error) {
                    console.error('Error sending message:', error);
                    alert('Message could not be sent. Please try again.');
                }
            }

            input.focus();
        }

        function scrollToBottom() {
            const container = document.getElementById('chatMessages');
            container.scrollTop = container.scrollHeight;
        }

        // ------------------------------------------------------------
        // Utilities
        // ------------------------------------------------------------
        function escapeHtml(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatMessageTime(value) {
            const date = new Date(value);
            if (Number.isNaN(date.getTime())) return '';
            return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        function formatListTime(value) {
            const date = new Date(value);
            if (Number.isNaN(date.getTime())) return '';

            const today = new Date();
            const sameDay = date.toDateString() === today.toDateString();

            return sameDay
                ? date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                : date.toLocaleDateString([], { month: 'short', day: 'numeric' });
        }

        function goBack() {
            window.location.href = currentUser.userType === 'creator'
                ? 'creator-dashboard.html'
                : 'freelancer-dashboard.html';
        }

        function logout() {
            localStorage.clear();
            window.location.href = 'index.html';
        }

        document.getElementById('messageInput').addEventListener('keydown', (event) => {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        });

        checkAuth();
    </script>
</body>
</html>
