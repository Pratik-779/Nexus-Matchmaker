<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Freelancers - Nexus</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav>
        <h1>Find Freelancers</h1>
        <div>
            <button onclick="window.location.href='creator-dashboard.html'">← Back to Dashboard</button>
            <button class="secondary" onclick="logout()" style="margin-left: 10px;">Logout</button>
        </div>
    </nav>

    <div style="max-width: 1200px; margin: 0 auto; padding: 20px;">
        <div class="card">
            <h3>✨ AI Smart Match</h3>
            <p>Describe what you need or type a specific role (e.g., "I need a Podcast Editor" or "UGC Creator").</p>
            <textarea id="aiPrompt" placeholder="What kind of freelancer are you looking for?"></textarea>
            <button id="searchBtn">Extract & Search</button>

            <div id="loading" style="display: none; margin-top: 15px; color: var(--primary);">
                🔄 Parsing intent with Gemini API and mapping to freelancer nodes...
            </div>

            <div id="results" class="talent-grid"></div>
        </div>
    </div>

    <script src="http://localhost:5000/socket.io/socket.io.js"></script>
    <script>
        const API_URL = 'http://localhost:5000/api';
        let currentUser = null;

        // Check auth
        function checkAuth() {
            const userStr = localStorage.getItem('nexus_user');
            if (!userStr) {
                window.location.href = 'index.html';
                return;
            }
            currentUser = JSON.parse(userStr);
        }

        checkAuth();

        // AI Search
        document.getElementById('searchBtn').addEventListener('click', async () => {
            const prompt = document.getElementById('aiPrompt').value.trim();

            if (!prompt) {
                return alert("Please enter a project description.");
            }

            const loading = document.getElementById('loading');
            const results = document.getElementById('results');

            results.innerHTML = '';
            loading.style.display = 'block';

            try {
                const response = await fetch(`${API_URL}/ai-match/search`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt })
                });

                const data = await response.json();
                loading.style.display = 'none';

                const { matches } = data;
                window.searchResults = matches || [];

                if (!matches || matches.length === 0) {
                    results.innerHTML = '<p style="color: var(--text-muted);">No matches found.</p>';
                    return;
                }

                let html = `
                    <div style="grid-column: 1 / -1; margin-bottom: 10px;">
                        <span style="color: var(--success);">✓ Found ${matches.length} Match(es)</span>
                    </div>
                `;

                matches.forEach(freelancer => {
                    const tags = freelancer.skills.map(s => `<span class="skill-tag">${s}</span>`).join('');
                    const availability = freelancer.isAvailable
                        ? '<span style="color: var(--success); font-size: 0.8rem;">● Available</span>'
                        : '<span style="color: var(--text-muted); font-size: 0.8rem;">● Booked</span>';

                    html += `
                        <div class="talent-card">
                            <h4>${freelancer.name}</h4>
                            <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 5px;">
                                ${freelancer.experience} | ⭐ ${freelancer.rating}
                            </p>
                            <p style="color: var(--primary); font-size: 0.9rem; margin-bottom: 10px;">
                                ${freelancer.role} • ${freelancer.matchScore}% Match
                            </p>
                            ${availability}
                            <div style="margin-top: 10px;">${tags}</div>
                            <p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 10px;">
                                ${freelancer.bio || ''}
                            </p>
                            <button style="width: 100%; margin-top: 15px; padding: 8px;" onclick="hireFreelancer('${freelancer._id}')">
                                Hire ${freelancer.name.split(' ')[0]}
                            </button>
                            <button class="secondary" style="width: 100%; margin-top: 8px; padding: 8px;" onclick="messageFreelancer('${freelancer._id}')">
                                💬 Message
                            </button>
                        </div>
                    `;
                });

                results.innerHTML = html;

            } catch (error) {
                loading.style.display = 'none';
                console.error('Error:', error);
                results.innerHTML = '<p style="color: #ef4444;">Error connecting to server.</p>';
            }
        });

        // Hire freelancer
        async function hireFreelancer(freelancerId) {
            const freelancer = (window.searchResults || []).find(f => f._id === freelancerId);
            const freelancerName = freelancer?.name || 'this freelancer';

            if (!confirm(`Hire ${freelancerName}?`)) return;

            try {
                const response = await fetch(`${API_URL}/collaborations/hire`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        creatorId: currentUser._id,
                        freelancerId: freelancerId
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    alert(`✅ ${freelancerName} hired successfully! A chat has been created.`);
                    if (data.chatId && confirm('Open your chat with them now?')) {
                        window.location.href = `chat.html?chat=${encodeURIComponent(data.chatId)}`;
                    } else {
                        window.location.href = 'creator-dashboard.html';
                    }
                } else {
                    alert(data.error || 'Failed to hire');
                }
            } catch (error) {
                console.error('Error hiring:', error);
                alert('Error hiring freelancer');
            }
        }

        function messageFreelancer(freelancerId) {
            window.location.href = `chat.html?with=${encodeURIComponent(freelancerId)}`;
        }

        function logout() {
            localStorage.clear();
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
